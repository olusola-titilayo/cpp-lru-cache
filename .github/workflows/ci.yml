name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DLRU_SANITIZE=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/memoize
